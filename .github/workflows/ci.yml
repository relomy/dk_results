name: CI

on:
  pull_request:
    # labeled/unlabeled re-run the schema compatibility gate when `breaking-change` is toggled.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
      - master

jobs:
  verify:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require dfs-common checkout token
        env:
          DFS_COMMON_CHECKOUT_TOKEN: ${{ secrets.DFS_COMMON_CHECKOUT_TOKEN }}
        run: |
          if [ -z "$DFS_COMMON_CHECKOUT_TOKEN" ]; then
            echo "::error::Missing secret DFS_COMMON_CHECKOUT_TOKEN (read access to ${{ github.repository_owner }}/dfs-common)."
            exit 1
          fi

      - name: Configure git auth for dfs-common
        env:
          DFS_COMMON_CHECKOUT_TOKEN: ${{ secrets.DFS_COMMON_CHECKOUT_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${DFS_COMMON_CHECKOUT_TOKEN}@github.com/${{ github.repository_owner }}/".insteadOf "https://github.com/${{ github.repository_owner }}/"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff Format Check
        run: uv run --group quality ruff format --check .

      - name: Ruff Check
        run: uv run --group quality ruff check .

      - name: Ty Check
        run: uv run --group quality ty check

      - name: Complexity Floor (xenon)
        run: uv run --group quality xenon --max-absolute B src

      - name: Complexity Ratchet
        run: uv run --group quality complexity-ratchet --base origin/main --head HEAD

      - name: Pytest
        run: uv run pytest

      # Compares the PR's committed contract schema with its base branch's, using only
      # this repository's artifacts (never the consumer's). A base without a schema passes.
      - name: Snapshot Schema Compatibility
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BREAKING_CHANGE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change') }}
        run: |
          base_dir="$RUNNER_TEMP/schema-base"
          mkdir -p "$base_dir"
          git show "origin/$BASE_REF:contract/snapshot.schema.json" > "$base_dir/snapshot.schema.json" 2>/dev/null \
            || rm -f "$base_dir/snapshot.schema.json"
          git show "origin/$BASE_REF:docs/SNAPSHOT_SCHEMA.md" > "$base_dir/SNAPSHOT_SCHEMA.md" 2>/dev/null \
            || rm -f "$base_dir/SNAPSHOT_SCHEMA.md"
          args=(--base "$base_dir/snapshot.schema.json" --base-doc "$base_dir/SNAPSHOT_SCHEMA.md")
          if [ "$BREAKING_CHANGE_LABEL" = "true" ]; then
            args+=(--breaking-change-label)
          fi
          uv run python check_snapshot_schema_compat.py "${args[@]}"
