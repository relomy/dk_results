name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require dfs-common checkout token
        env:
          DFS_COMMON_CHECKOUT_TOKEN: ${{ secrets.DFS_COMMON_CHECKOUT_TOKEN }}
        run: |
          if [ -z "$DFS_COMMON_CHECKOUT_TOKEN" ]; then
            echo "::error::Missing secret DFS_COMMON_CHECKOUT_TOKEN (read access to ${{ github.repository_owner }}/dfs-common)."
            exit 1
          fi

      - name: Configure git auth for dfs-common
        env:
          DFS_COMMON_CHECKOUT_TOKEN: ${{ secrets.DFS_COMMON_CHECKOUT_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${DFS_COMMON_CHECKOUT_TOKEN}@github.com/${{ github.repository_owner }}/".insteadOf "https://github.com/${{ github.repository_owner }}/"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff Format Check
        run: uv run --group quality ruff format --check .

      - name: Ruff Check
        run: uv run --group quality ruff check .

      - name: Ty Check
        run: uv run --group quality ty check

      - name: Complexity Floor (xenon)
        run: uv run --group quality xenon --max-absolute C src

      - name: Complexity Ratchet
        run: uv run --group quality complexity-ratchet --base origin/main --head HEAD

      - name: Pytest
        run: uv run pytest
