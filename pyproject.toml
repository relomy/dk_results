[project]
name = "dk_results"
version = "0.1.0"
description = ""
requires-python = ">=3.11,<3.12"

dependencies = [
    "google-api-python-client",
    "requests>=2.33.0",
    "pulp",
    "rookiepy",
    "pyyaml",
    "dotenv",
    "discord",
    "aiohttp>=3.14.3",
    "dfs-common",
    "cryptography>=48.0.1",
    "httplib2>=0.32.0",
    "idna>=3.15",
    "pyasn1>=0.6.4",
    "python-dotenv>=1.2.2",
    "urllib3>=2.7.0",
    "pydantic>=2.13.4",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio",
    "pytest-cov",
    "radon",
    "ruff",
    "ty",
]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.uv.sources]
dfs-common = { git = "https://github.com/relomy/dfs-common", branch = "main" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ty]

[tool.ty.src]
exclude = ["tests"]
